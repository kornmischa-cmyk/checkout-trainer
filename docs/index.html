/* Layout: ein Scoreboard oben (Rest in Großziffern), darunter Dart-Slots und Eingabe wie ein Tastenfeld; zweiter Tab ist die Übersicht aller Wege. */
:root {
  --bg: #0A130E;          /* Boardgrün, fast schwarz */
  --panel: #12201A;
  --panel-2: #192B22;
  --line: #2A4036;
  --fg: #ECE8DA;          /* Kreide */
  --muted: #93A398;
  --amber: #D2A82B;       /* Scoreboard-Gelb */
  --amber-ink: #1A1403;
  --good: #5DBB7A;
  --bad: #E0594E;
  --b0: #22332A; --b1: #B8473F; --b2: #C97B34; --b3: #C9A227; --b4: #8FB04A; --b5: #4FAE72;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .04em; text-transform: uppercase; margin: 0; line-height: 1; text-wrap: balance; }
h1 span { color: var(--amber); }
.session { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.session b { color: var(--fg); font-weight: 600; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; color: var(--muted); font-weight: 600; min-height: 44px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--amber); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.rangeinfo { color: var(--muted); font-size: 14px; }

.board { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px 16px 16px; display: grid; gap: 14px; }
.score-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.lbl { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.score { font-family: var(--display); font-weight: 800; font-size: clamp(88px, 26vw, 150px); line-height: .85; color: var(--amber); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.box-badge { text-align: right; display: grid; gap: 4px; justify-items: end; }
.box-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--b0); display: inline-block; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { border: 1px dashed var(--line); border-radius: 6px; min-height: 76px; padding: 8px 10px; display: grid; align-content: center; justify-items: center; gap: 2px; background: var(--bg); }
.slot.filled { border-style: solid; border-color: #3C5A4B; }
.slot.next { border-color: var(--amber); }
.slot .d { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.slot .rest { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.slot .empty { color: #3A4F44; font-family: var(--display); font-size: 30px; font-weight: 700; }
.slot.hint .d { color: var(--amber); }

.pad { display: grid; gap: 10px; }
.mult { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.m { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; min-height: 48px; font-weight: 700; letter-spacing: .04em; }
.m[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
.nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.n { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; min-height: 48px; font-family: var(--display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.n.bull { grid-column: 1 / -1; font-size: 20px; letter-spacing: .08em; }
.n:active, .m:active { transform: translateY(1px); }
button:disabled { opacity: .35; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; min-height: 48px; font-weight: 600; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); flex: 1 1 140px; font-weight: 700; }
.btn.ghost { background: none; }

.result { border-radius: 6px; border: 1px solid var(--line); border-left-width: 5px; padding: 14px 16px; display: grid; gap: 8px; background: var(--panel-2); }
.result.ok { border-left-color: var(--good); }
.result.no { border-left-color: var(--bad); }
.result h2 { margin: 0; font-size: 18px; }
.result p { margin: 0; }
.route { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.small { color: var(--muted); font-size: 14px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.prog { display: grid; gap: 6px; }
.bar { height: 8px; border-radius: 4px; background: var(--panel); overflow: hidden; display: flex; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.cell { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel); display: grid; gap: 2px; min-width: 0; position: relative; }
.cell .cn { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.cell .cr { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.cell .cb { position: absolute; right: 8px; top: 8px; font-size: 11px; font-weight: 700; color: var(--amber-ink); background: var(--c, var(--b0)); border-radius: 999px; min-width: 18px; text-align: center; padding: 1px 5px; }
.cell { border-left: 5px solid var(--c, var(--b0)); }
.cell.bogey .cr { font-style: italic; }
.resetbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.danger { border-color: var(--bad); color: var(--bad); }
.note { color: var(--muted); font-size: 13px; }
@media (min-width: 640px) { .nums { grid-template-columns: repeat(10, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>/* Reine Logik des Checkout-Trainers (läuft im Browser und in Node). */
(function (root) {
  function dartValue(d) { return ({ S: 1, D: 2, T: 3 })[d.m] * d.n; }
  function label(d) {
    if (d.n === 25) return d.m === 'D' ? 'Bull' : '25';
    return d.m + d.n;
  }
  function parseToken(t) {
    if (t === 'Bull') return { m: 'D', n: 25 };
    return { m: t[0], n: parseInt(t.slice(1), 10) };
  }
  function parseRoutes(txt) {
    var out = {};
    txt.trim().split('\n').forEach(function (l) {
      var p = l.trim().split(/\s+/);
      out[+p[0]] = p.slice(1).map(parseToken);
    });
    return out;
  }
  function routeText(r) { return r.map(label).join(' '); }
  function sum(darts) { return darts.reduce(function (a, d) { return a + dartValue(d); }, 0); }
  function isValidDart(d) {
    if (d.n === 25) return d.m !== 'T';
    return d.n >= 1 && d.n <= 20;
  }
  /* Bewertet eine eingegebene Dartfolge. */
  function evaluate(score, darts) {
    var s = sum(darts);
    var last = darts[darts.length - 1];
    var lastDouble = !!last && last.m === 'D';
    return { ok: darts.length > 0 && darts.length <= 3 && s === score && lastDouble, sum: s, lastDouble: lastDouble };
  }
  function pool(routesObj, lo, hi) {
    var a = [];
    for (var i = Math.max(2, lo); i <= Math.min(170, hi); i++) a.push(i);
    return a;
  }
  var WEIGHTS = [6, 8, 5, 3, 2, 1]; /* Index = Box, 0 = noch nie gesehen */
  function pick(poolArr, boxes, lastScore, rnd) {
    var cand = poolArr.filter(function (s) { return s !== lastScore; });
    if (!cand.length) cand = poolArr.slice();
    var w = cand.map(function (s) { return WEIGHTS[boxes[s] || 0]; });
    var total = w.reduce(function (a, b) { return a + b; }, 0);
    var r = rnd() * total;
    for (var i = 0; i < cand.length; i++) { r -= w[i]; if (r < 0) return cand[i]; }
    return cand[cand.length - 1];
  }
  /* Neue Box nach einer Antwort. Mit Tipp gibt es keine Beförderung. */
  function nextBox(box, correct, hinted) {

    if (!correct) return 1;
    if (hinted) return Math.max(box, 1);
    return Math.min(5, Math.max(box, 1) + 1);
  }

<script>(function () {
  var ROUTES = CO.parseRoutes(window.ROUTES_TXT);
  var RANGES = [[2, 40, '2–40'], [41, 60, '41–60'], [61, 100, '61–100'], [101, 170, '101–170'], [2, 170, 'Alles']];
  var KEY = 'checkout-trainer-v1';
  var BOXCOL = ['var(--b0)', 'var(--b1)', 'var(--b2)', 'var(--b3)', 'var(--b4)', 'var(--b5)'];
  var st = { tab: 'train', range: 1, boxes: {}, cur: null, sess: { n: 0, ok: 0, streak: 0 }, last: null, confirmReset: false, mult: 'S' };

  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (o) { st.boxes = o.boxes || {}; if (typeof o.range === 'number' && RANGES[o.range]) st.range = o.range; }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ boxes: st.boxes, range: st.range })); } catch (e) {} }
  function poolNow() { var r = RANGES[st.range]; return CO.pool(ROUTES, r[0], r[1]); }
  function nextQuestion() {
    var s = CO.pick(poolNow(), st.boxes, st.last, Math.random);
    st.cur = { score: s, darts: [], hint: false, res: null };
    st.mult = 'S';
  }
  function isBogey(s) { return !ROUTES[s]; }
  function $(id) { return document.getElementById(id); }

  function slotsHtml() {
    var c = st.cur, rem = c.score, h = '';
    for (var i = 0; i < 3; i++) {
      var d = c.darts[i];
      if (d) {
        rem -= CO.dartValue(d);
        h += '<div class="slot filled"><span class="d">' + CO.label(d) + '</span><span class="rest">Rest ' + rem + '</span></div>';
      } else if (c.hint && i === 0 && !c.res && ROUTES[c.score]) {
        h += '<div class="slot hint next"><span class="d">' + CO.label(ROUTES[c.score][0]) + '</span><span class="rest">Tipp</span></div>';
      } else {
        h += '<div class="slot' + (i === c.darts.length && !c.res ? ' next' : '') + '"><span class="empty">–</span><span class="rest">Dart ' + (i + 1) + '</span></div>';
      }
    }
    return h;
  }
  function resultHtml() {
    var c = st.cur, r = c.res; if (!r) return '';
    var std = ROUTES[c.score];
    var h = '<div class="result ' + (r.ok ? 'ok' : 'no') + '" role="status"><h2>' + r.title + '</h2>';
    if (r.body) h += '<p>' + r.body + '</p>';
    if (std) h += '<div><div class="lbl">Standardweg</div><div class="route">' + CO.routeText(std) + '</div></div>';
    h += '<p class="small">' + r.boxNote + '</p>';
    h += '<div class="actions"><button class="btn primary" data-a="next" id="nextbtn">Nächster Checkout</button></div></div>';
    return h;
  }
  function boxPill(s) {
    var b = st.boxes[s] || 0;
    return '<span class="box-pill"><i class="dot" style="background:' + BOXCOL[b] + '"></i>' + (b ? 'Box ' + b + ' von 5' : 'Neu') + '</span>';
  }
  function trainHtml() {
    var c = st.cur, done = !!c.res, full = c.darts.length >= 3;
    var h = '<div class="chips" role="group" aria-label="Zahlenbereich">';
    RANGES.forEach(function (r, i) { h += '<button class="chip" data-a="range" data-i="' + i + '" aria-pressed="' + (i === st.range) + '">' + r[2] + '</button>'; });
    h += '</div>';
    h += '<section class="board" aria-label="Aufgabe"><div class="score-row"><div><div class="lbl">Rest</div><div class="score">' + c.score + '</div></div>';
    h += '<div class="box-badge">' + boxPill(c.score) + '<span class="small">bis zu 3 Darts, Ende auf Double</span></div></div>';
    h += '<div class="slots">' + slotsHtml() + '</div>';
    h += '<div class="pad"><div class="mult" role="group" aria-label="Ring">';
    [['S', 'Single'], ['D', 'Double'], ['T', 'Triple']].forEach(function (m) {
      h += '<button class="m" data-a="mult" data-m="' + m[0] + '" aria-pressed="' + (st.mult === m[0]) + '"' + (done ? ' disabled' : '') + '>' + m[1] + '</button>';
    });
    h += '</div><div class="nums">';
    for (var n = 1; n <= 20; n++) h += '<button class="n" data-a="num" data-n="' + n + '"' + (done || full ? ' disabled' : '') + '>' + n + '</button>';
    h += '<button class="n bull" data-a="num" data-n="25"' + (done || full || st.mult === 'T' ? ' disabled' : '') + '>' + (st.mult === 'D' ? 'Bull (50)' : '25 (Single Bull)') + '</button>';
    h += '</div></div>';
    h += '<div class="actions"><button class="btn" data-a="undo"' + (done || !c.darts.length ? ' disabled' : '') + '>Zurück</button>';
    h += '<button class="btn" data-a="hint"' + (done || c.hint || isBogey(c.score) ? ' disabled' : '') + '>Tipp: erster Dart</button>';
    h += '<button class="btn" data-a="bogey"' + (done ? ' disabled' : '') + '>Nicht checkbar</button>';
    h += '<button class="btn primary" data-a="check"' + (done || !c.darts.length ? ' disabled' : '') + '>Prüfen</button></div>';
    h += resultHtml() + '</section>';
    h += '<p class="note">Jeder gültige Weg zählt: Summe stimmt und der letzte Dart ist ein Double. Mit Tipp gibt es keine neue Box, ein Fehler setzt auf Box 1 zurück.</p>';
    return h;
  }
  function counts() {
    var c = [0, 0, 0, 0, 0, 0], p = poolNow();
    p.forEach(function (s) { c[st.boxes[s] || 0]++; });
    return { c: c, total: p.length, sits: c[4] + c[5] };
  }
  function overviewHtml() {
    var p = poolNow(), k = counts(), h = '';
    h += '<div class="chips" role="group" aria-label="Zahlenbereich">';
    RANGES.forEach(function (r, i) { h += '<button class="chip" data-a="range" data-i="' + i + '" aria-pressed="' + (i === st.range) + '">' + r[2] + '</button>'; });
    h += '</div><div class="prog"><div><b>' + k.sits + ' von ' + k.total + '</b> sitzen <span class="small">(Box 4 oder 5)</span></div><div class="bar" aria-hidden="true">';
    for (var b = 5; b >= 0; b--) if (k.c[b]) h += '<i style="width:' + (k.c[b] / k.total * 100) + '%;background:' + BOXCOL[b] + '"></i>';
    h += '</div><div class="legend">';
    h += '<span><i class="dot"></i>Neu ' + k.c[0] + '</span>';

    h += '</div></div><div class="grid">';
    p.slice().reverse().forEach(function (s) {
      var b = st.boxes[s] || 0, bog = isBogey(s);
      h += '<div class="cell' + (bog ? ' bogey' : '') + '" style="--c:' + BOXCOL[b] + '"><span class="cn">' + s + '</span><span class="cr">' + (bog ? 'nicht checkbar' : CO.routeText(ROUTES[s])) + '</span>' + (b ? '<span class="cb">' + b + '</span>' : '') + '</div>';
    });
    h += '</div><div class="resetbox">';
    if (st.confirmReset) {
      h += '<span>Alle Boxen auf Neu setzen?</span><button class="btn danger" data-a="reset-yes">Ja, zurücksetzen</button><button class="btn ghost" data-a="reset-no">Abbrechen</button>';
    } else h += '<button class="btn ghost" data-a="reset">Fortschritt zurücksetzen</button>';
    h += '</div><p class="note">Die Wege sind die gängigen Standardrouten. Dein Fortschritt liegt in diesem Browser auf diesem Gerät.</p>';
    return h;
  }
  function render() {
    var s = st.sess;
    var h = '<header><h1>Checkout<span>.</span>Trainer</h1><div class="session">Heute <b>' + s.ok + '/' + s.n + '</b> richtig · Serie <b>' + s.streak + '</b></div></header>';
    h += '<div class="tabs" role="tablist"><button class="tab" role="tab" data-a="tab" data-t="train" aria-selected="' + (st.tab === 'train') + '">Training</button><button class="tab" role="tab" data-a="tab" data-t="over" aria-selected="' + (st.tab === 'over') + '">Übersicht</button></div>';
    h += st.tab === 'train' ? trainHtml() : overviewHtml();
    $('app').innerHTML = h;
    if (st.tab === 'train' && st.cur.res) { var nb = $('nextbtn'); if (nb) nb.focus({ preventScroll: true }); }
  }
  function finish(ok, title, body) {
    var c = st.cur, old = st.boxes[c.score] || 0, nb = CO.nextBox(old, ok, c.hint);
    st.boxes[c.score] = nb; save();
    st.sess.n++; if (ok) { st.sess.ok++; st.sess.streak++; } else st.sess.streak = 0;
    var note = c.hint && ok ? 'Mit Tipp gelöst: Box bleibt bei ' + nb + '.' : (nb === old ? 'Box ' + nb + ' bleibt.' : (old ? 'Box ' + old : 'Neu') + ' → Box ' + nb + '.');
    c.res = { ok: ok, title: title, body: body, boxNote: note };
    st.last = c.score;
  }
  function check() {
    var c = st.cur, e = CO.evaluate(c.score, c.darts), std = ROUTES[c.score];
    if (e.ok) {
      var same = std && CO.routeText(std) === CO.routeText(c.darts);
      finish(true, 'Richtig', same ? 'Das ist der Standardweg.' : 'Ein anderer gültiger Weg, ' + CO.routeText(c.darts) + '.');
    } else if (!std) {
      finish(false, 'Nicht ganz', c.score + ' lässt sich mit drei Darts nicht checken.');
    } else if (e.sum !== c.score) {
      finish(false, 'Nicht ganz', 'Deine Darts ergeben ' + e.sum + ', gebraucht werden ' + c.score + '.');
    } else {
      finish(false, 'Nicht ganz', 'Die Summe passt, aber der letzte Dart muss ein Double sein.');
    }
  }
  function bogey() {
    var c = st.cur;
    if (isBogey(c.score)) finish(true, 'Richtig', c.score + ' ist mit drei Darts nicht checkbar. Setup-Dart spielen.');
    else finish(false, 'Nicht ganz', c.score + ' ist mit drei Darts checkbar.');
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
    var a = b.dataset.a, c = st.cur;
    if (a === 'tab') { st.tab = b.dataset.t; st.confirmReset = false; }
    else if (a === 'range') { st.range = +b.dataset.i; save(); nextQuestion(); }
    else if (a === 'mult') st.mult = b.dataset.m;
    else if (a === 'num') {
      if (c.darts.length < 3 && !c.res) { c.darts.push({ m: st.mult, n: +b.dataset.n }); st.mult = 'S'; }
    }
    else if (a === 'undo') c.darts.pop();
    else if (a === 'hint') c.hint = true;
    else if (a === 'check') check();
    else if (a === 'bogey') bogey();
    else if (a === 'next') nextQuestion();
    else if (a === 'reset') st.confirmReset = true;
    else if (a === 'reset-no') st.confirmReset = false;
    else if (a === 'reset-yes') { st.boxes = {}; st.confirmReset = false; save(); }
    render();
  });
  load(); nextQuestion(); render();
